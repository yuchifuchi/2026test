<title>電話応対日報 集計システム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@400;600&display=swap">
<style>
/* ==========================================================================
   電話応対日報 集計システム ― Web 版モックアップ
   画面は角ゴシック、そこから出る帳票は明朝。
   「操作するもの」と「紙に残るもの」を書体で分けている。
   ========================================================================== */
:root{
  --ground:#f6f5f2; --panel:#ffffff; --panel2:#fbfaf7;
  --ink:#17202c; --muted:#5b6675; --line:#dcd8d0; --line2:#eceae4;
  --accent:#1f4e79; --accent-soft:#e8eff6; --brass:#8a6a2c; --brass-soft:#f4eddc;
  --ok:#1b6b45; --ok-soft:#e6f1ea; --warn:#8a5a12; --warn-soft:#fbf1de;
  --crit:#a02c2c; --crit-soft:#f8e9e9;
  --shadow:0 1px 2px rgba(23,32,44,.06), 0 6px 18px rgba(23,32,44,.05);
  --r:7px;
  --ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#11151b; --panel:#181e26; --panel2:#1d242e;
    --ink:#e7eaee; --muted:#97a2af; --line:#2b3440; --line2:#232b35;
    --accent:#79aede; --accent-soft:#1b2a3a; --brass:#cba75f; --brass-soft:#2a2416;
    --ok:#66c793; --ok-soft:#14271e; --warn:#dda94b; --warn-soft:#2a2214;
    --crit:#e5817f; --crit-soft:#2b1a1a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#11151b; --panel:#181e26; --panel2:#1d242e;
  --ink:#e7eaee; --muted:#97a2af; --line:#2b3440; --line2:#232b35;
  --accent:#79aede; --accent-soft:#1b2a3a; --brass:#cba75f; --brass-soft:#2a2416;
  --ok:#66c793; --ok-soft:#14271e; --warn:#dda94b; --warn-soft:#2a2214;
  --crit:#e5817f; --crit-soft:#2b1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* --- ヘッダ --- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line);
}
.bar-in{
  max-width:1240px; margin:0 auto; padding:12px 22px 0;
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
}
.brand{font-weight:700; font-size:17px; letter-spacing:.02em}
.brand em{
  font-style:normal; font-size:11px; font-weight:500; color:var(--brass);
  letter-spacing:.16em; margin-left:10px; vertical-align:2px;
}
.bar-in .spacer{flex:1}
.themetog{
  background:none; border:1px solid var(--line); color:var(--muted);
  border-radius:99px; padding:4px 13px; font-size:12px; cursor:pointer;
}
.themetog:hover{border-color:var(--accent); color:var(--accent)}
nav{max-width:1240px; margin:0 auto; padding:6px 22px 0; display:flex; gap:2px; overflow-x:auto}
nav button{
  background:none; border:0; border-bottom:2px solid transparent;
  padding:9px 15px 10px; font-size:14px; color:var(--muted); cursor:pointer;
  white-space:nowrap;
}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:700}

/* --- 整合性ストリップ: このシステムの主張そのもの --- */
.truth{
  background:var(--brass-soft); border-bottom:1px solid var(--line);
  font-size:13px;
}
.truth-in{
  max-width:1240px; margin:0 auto; padding:8px 22px;
  display:flex; gap:10px 20px; align-items:center; flex-wrap:wrap;
}
.truth b{font-variant-numeric:tabular-nums; color:var(--brass); font-size:15px}
.truth .eq{color:var(--brass); font-weight:700}
.truth .why{color:var(--muted); margin-left:auto; font-size:12px}

main{max-width:1240px; margin:0 auto; padding:26px 22px 70px}
.screen{display:none}
.screen.on{display:block; animation:fade .18s ease-out}
@keyframes fade{from{opacity:0; transform:translateY(3px)}to{opacity:1; transform:none}}

h1{font-size:23px; margin:0 0 6px; letter-spacing:.01em; text-wrap:balance}
h2{
  font-size:14px; margin:30px 0 12px; color:var(--muted);
  letter-spacing:.1em; font-weight:700;
}
h2:first-child{margin-top:0}
.lead{color:var(--muted); font-size:14px; margin:0 0 22px; max-width:64ch}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 20px; box-shadow:var(--shadow);
}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end}

label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing:.04em}
input,select,textarea{
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:8px 10px; width:100%;
}
input[type=number]{text-align:right; font-variant-numeric:tabular-nums}
textarea{min-height:76px; resize:vertical; line-height:1.6}
.f-sm{max-width:135px} .f-md{max-width:250px} .f-num{max-width:88px}

.btn{
  background:var(--accent); color:#fff; border:1px solid var(--accent);
  border-radius:6px; padding:8px 17px; cursor:pointer; white-space:nowrap;
}
.btn:hover{filter:brightness(1.08)}
.btn.q{background:var(--panel); color:var(--accent)}
.btn.q:hover{background:var(--accent-soft); filter:none}
.btn.x{background:var(--panel); color:var(--crit); border-color:var(--line)}
.btn.x:hover{background:var(--crit-soft); border-color:var(--crit)}
.btn.sm{padding:5px 11px; font-size:13px}

/* --- 表 --- */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--panel)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:8px 12px; text-align:left; border-bottom:1px solid var(--line2); vertical-align:middle}
th{
  background:var(--panel2); font-size:12px; color:var(--muted); font-weight:700;
  letter-spacing:.06em; white-space:nowrap; border-bottom:1px solid var(--line);
}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:var(--panel2); font-weight:700; border-top:1px solid var(--line)}
.empty{color:var(--muted); padding:22px 12px; text-align:center; font-size:14px}

/* --- 統計タイル --- */
.stat{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 17px; box-shadow:var(--shadow);
}
.stat .k{font-size:12px; color:var(--muted); letter-spacing:.08em}
.stat .v{
  font-size:31px; font-weight:700; line-height:1.25; font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.stat .u{font-size:14px; font-weight:400; color:var(--muted); margin-left:3px}
.stat .s{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.stat.hi{border-color:var(--brass)}
.stat.hi .v{color:var(--brass)}

.pill{
  display:inline-block; padding:2px 11px; border-radius:99px; font-size:12px;
  font-weight:500; white-space:nowrap;
}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.wip{background:var(--warn-soft); color:var(--warn)}
.pill.off{background:var(--line2); color:var(--muted)}

.note{
  border-left:3px solid var(--brass); background:var(--brass-soft);
  padding:11px 15px; border-radius:0 var(--r) var(--r) 0; font-size:13px;
  color:var(--ink); margin:16px 0;
}
.note b{color:var(--brass)}
.note.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.note.warn b{color:var(--warn)}

.tiles{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(262px,1fr))}
.tile{
  text-align:left; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r); padding:17px 19px; cursor:pointer; box-shadow:var(--shadow);
}
.tile:hover{border-color:var(--accent); background:var(--accent-soft)}
.tile b{display:block; color:var(--accent); font-size:16px; margin-bottom:3px}
.tile span{font-size:13px; color:var(--muted)}

/* ==========================================================================
   帳票  ―  紙は常に紙。テーマに関係なく白地に黒、明朝で組む。
   ========================================================================== */
.paper{
  background:#fff; color:#000; font-family:var(--mincho);
  width:min(186mm,100%); margin:0 auto; padding:12mm 10mm;
  border:1px solid var(--line); border-radius:2px; box-shadow:var(--shadow);
  font-size:14px; line-height:1.5;
}
.paper .kanai{font-size:12px}
.paper .date{text-align:right; font-size:15px; margin-top:-20px}
.paper .ttl{
  text-align:center; font-size:22px; font-weight:600; letter-spacing:.22em;
  margin:12px 0 14px;
}
.paper table{width:100%; border-collapse:collapse; font-size:13px; color:#000}
.paper th,.paper td{border:1px solid #000; padding:3px 6px; color:#000; background:#fff}
.paper th{font-weight:600; letter-spacing:.04em}
.paper td.blank{border:none; background:#fff}
.paper .memo{
  border:1px solid #000; min-height:19mm; padding:5px 8px; white-space:pre-wrap;
  font-size:13px; margin-bottom:9px;
}
.paper .cap{font-size:13px; font-weight:600; margin:9px 0 3px}
.paper .big{text-align:center; font-size:19px; font-weight:600; line-height:1.2}
.paper .sub{text-align:center; font-size:11px; color:#000}
.paper .uchi{text-align:right; font-size:13px; margin:7px 0 0}

/* --- 印刷バー --- */
.printbar{
  display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 18px; margin-bottom:18px; box-shadow:var(--shadow);
}
.printbar .legend{margin:0 0 6px; align-self:center}

footer{
  max-width:1240px; margin:0 auto; padding:22px; color:var(--muted);
  font-size:12.5px; border-top:1px solid var(--line);
}
footer a{color:var(--accent)}
.legend{font-size:12px; color:var(--muted); margin-top:8px}

/* ==========================================================================
   印刷  ―  帳票だけを A4 縦 1 枚に出す。画面まわりは全部落とす。
   ========================================================================== */
@page{ size:A4 portrait; margin:12mm }

@media print{
  .bar, .truth, footer, .printbar, .noprint{display:none !important}
  body{background:#fff; color:#000; font-size:10.5pt}
  main{max-width:none; margin:0; padding:0}
  #s-paper > h1, #s-paper > .lead{display:none}
  .screen{display:none !important}
  .screen.on{display:block !important}
  .paper{
    width:auto; margin:0; padding:0;
    border:0; border-radius:0; box-shadow:none;
  }
  /* 表が途中で改ページされると罫線が切れて見えるので、まとまりごとに送る */
  .paper table, .paper .memo{page-break-inside:avoid; break-inside:avoid}
  a{text-decoration:none; color:#000}
}
</style>
